<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Movie Theater Booking{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load django_bootstrap5 %}
    {% bootstrap_css %}
  </head>
  <body class="container py-4">
    <nav class="navbar navbar-expand border-bottom mb-4" aria-label="Main navigation">
      <a class="navbar-brand" href="{% url 'movie-list' %}">Movie Theater</a>
      <div class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <span class="nav-link">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-link border-0 bg-transparent" type="submit">
              Sign out
            </button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Sign in</a>
          <a class="nav-link" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </nav>
    {% if messages %}
      <div aria-live="polite">
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}" role="status">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
